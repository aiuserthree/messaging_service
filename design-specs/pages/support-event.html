<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 - 톡벨 화면설계서</title>
    <link rel="stylesheet" href="../assets/common.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <a href="../index.html" class="back-btn">← 목록으로</a>
                <div class="page-info">
                    <span class="page-id-badge">FE-P010-03</span>
                    <span class="page-title-header">이벤트</span>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-secondary" onclick="window.open('../../support-event.html', '_blank')">🔗 실제 페이지</button>
                <button class="btn btn-secondary" onclick="reloadIframe()">🔄 새로고침</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="mockup-panel">
            <div class="mockup-canvas">
                <div class="mockup-frame wide">
                    <div class="browser-chrome">
                        <div class="browser-dots">
                            <div class="browser-dot red"></div>
                            <div class="browser-dot yellow"></div>
                            <div class="browser-dot green"></div>
                        </div>
                        <div class="browser-url">https://tokbell.co.kr/support-event.html</div>
                    </div>
                    <div class="mockup-content">
                        <div class="iframe-container" style="height: 700px;">
                            <iframe id="pageIframe" class="page-iframe" src="../../support-event.html" style="height: 700px;" onload="hideLoading()"></iframe>
                            <div class="iframe-loading" id="iframeLoading">
                                <div class="iframe-loading-spinner"></div>
                                <div>로딩 중...</div>
                            </div>
                            <div class="marker-overlay" id="markerOverlay">
                                <div class="marker" data-id="1" style="top: 120px; right: 20px;">1</div>
                                <div class="marker" data-id="2" style="top: 350px; right: 20px;">2</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="description-panel">
            <div class="desc-header">
                <div class="desc-title">화면 설명서</div>
                <div class="desc-subtitle">support-event.html · 이벤트 페이지</div>
            </div>
            <div class="desc-content">
                <div class="desc-item expanded" data-id="1">
                    <div class="desc-item-header">
                        <div class="desc-number">1</div>
                        <div class="desc-item-title">이벤트 탭</div>
                        <span class="desc-toggle">▼</span>
                    </div>
                    <div class="desc-item-body">
                        <div class="desc-text">이벤트 상태별로 필터링합니다.</div>
                        <table class="desc-table">
                            <tr><th>탭</th><th>설명</th></tr>
                            <tr><td>전체</td><td>모든 이벤트</td></tr>
                            <tr><td>진행중</td><td>현재 진행 중인 이벤트</td></tr>
                            <tr><td>종료</td><td>종료된 이벤트</td></tr>
                        </table>
                    </div>
                </div>

                <div class="desc-item" data-id="2">
                    <div class="desc-item-header">
                        <div class="desc-number">2</div>
                        <div class="desc-item-title">이벤트 목록</div>
                        <span class="desc-toggle">▼</span>
                    </div>
                    <div class="desc-item-body">
                        <div class="desc-text">이벤트를 카드 형태로 표시합니다.</div>
                        <table class="desc-table">
                            <tr><th>요소</th><th>설명</th></tr>
                            <tr><td>썸네일</td><td>이벤트 대표 이미지</td></tr>
                            <tr><td>제목</td><td>이벤트 제목</td></tr>
                            <tr><td>기간</td><td>이벤트 진행 기간</td></tr>
                            <tr><td>상태</td><td>진행중/종료 뱃지</td></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/common.js"></script>
    <script>
        function hideLoading() {
            document.getElementById('iframeLoading').style.display = 'none';
        }
        
        function reloadIframe() {
            const iframe = document.getElementById('pageIframe');
            document.getElementById('iframeLoading').style.display = 'block';
            iframe.src = iframe.src;
        }
    </script>
</body>
</html>
